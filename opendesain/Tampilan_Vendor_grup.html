<!doctype html>
<html lang="id">
<head><script type="application/json" data-od-external-dependencies>["https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"]</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Tarlink Vendor — Enam Layar Vendor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1220;
    --canvas:#EEEEE9;
    --card:#FAFAF7;
    --card-2:#FFFFFF;
    --line:#DDDDD7;
    --muted:#606870;
    --lime:#D9FB4F;
    --lime-dk:#BDDB2C;
    --amber:#9A4208;
    --green:#076C48;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0}
  body{
    color:var(--ink);min-height:100vh;
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    /* outer board: warm neutral + big lime glow top-centre */
    background:
      radial-gradient(ellipse 900px 500px at 50% -5%,rgba(217,251,79,.28),transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 110%,rgba(11,18,32,.10),transparent 65%),
      #E4E5E0;
  }
  /* outer board grid */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(11,18,32,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(11,18,32,.05) 1px,transparent 1px);
    background-size:28px 28px;
    -webkit-mask-image:radial-gradient(ellipse 70% 65% at 50% 40%,#000 10%,transparent 75%);
    mask-image:radial-gradient(ellipse 70% 65% at 50% 40%,#000 10%,transparent 75%);
  }
  ::selection{background:var(--ink);color:var(--lime)}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* ── presentation wrapper ── */
  .page{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

  /* top bar */
  .topbar{border-bottom:1px solid rgba(11,18,32,.11);background:rgba(228,229,224,.82);backdrop-filter:blur(8px)}
  .topbar-in{
    max-width:1200px;margin:0 auto;padding:16px 32px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .bmark{
    width:30px;height:30px;display:grid;place-items:center;
    background:var(--ink);color:var(--lime);border-radius:6px;
    font-size:12.5px;font-weight:800;letter-spacing:.02em;
  }
  .bname{font-size:13px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
  .bsub{font-size:11px;color:var(--muted);margin-top:1px}
  .tcenter{text-align:center}
  .tkicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#747D82;margin:0 0 2px}
  .ttitle{font-size:14.5px;font-weight:700;letter-spacing:-.012em;margin:0}
  .chips{display:flex;gap:7px}
  .chip{
    padding:4px 9px;border:1px solid rgba(11,18,32,.14);border-radius:5px;
    background:rgba(255,255,255,.5);font-size:11px;font-weight:600;color:#414C5C;
  }

  /* stage */
  .stage{
    flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:52px 60px;
    padding:44px 32px 40px;max-width:1160px;width:100%;margin:0 auto;
  }
  .stage figure{margin:0;flex:0 0 auto}

  figcaption{
    display:flex;align-items:baseline;gap:8px;margin-top:13px;padding-top:9px;
    border-top:1px solid rgba(11,18,32,.13);
  }
  .fno{font-size:11px;font-weight:800;color:#818894;font-variant-numeric:tabular-nums}
  .fname{font-size:12.5px;font-weight:700}
  .fnote{margin-left:auto;font-size:11px;color:var(--muted)}

  /* footer */
  .footbar{border-top:1px solid rgba(11,18,32,.11);margin-top:auto}
  .footbar-in{
    max-width:1200px;margin:0 auto;padding:13px 32px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .toks{display:flex;gap:14px;flex-wrap:wrap}
  .tok{display:flex;align-items:center;gap:6px;font-size:11px;color:#4E5660}
  .tok i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(11,18,32,.13);display:block;flex:0 0 auto}
  .fnl{font-size:11px;color:var(--muted)}

  /* ── device shell ── */
  .device{
    width:390px;height:844px;flex:0 0 auto;
    background:#131E32;
    border-radius:48px;
    padding:10px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.08) inset,
      0 0 0 1px rgba(0,0,0,.55),
      0 36px 72px -36px rgba(11,18,32,.65),
      0 12px 24px -16px rgba(11,18,32,.35);
  }
  .screen{
    position:relative;
    width:100%;height:100%;
    border-radius:40px;
    overflow:hidden;
    display:flex;flex-direction:column;
    /* screen bg: warm tinted, slightly different per zone via sections */
    background:#EEEEE9;
  }

  /* ── dark header ── */
  .apphead{
    flex:0 0 auto;z-index:2;position:relative;
    background:
      radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 0/9px 9px,
      linear-gradient(165deg,#182540 0%,#0B1220 100%);
    color:#fff;
  }
  .apphead::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
    background:var(--lime);
  }
  .sbar{
    height:42px;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  }
  .sbar-r{display:flex;align-items:center;gap:6px}
  .head-row{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:0 18px 10px;
  }
  .vnd{display:flex;align-items:center;gap:10px;min-width:0}
  .vmark{
    width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;
    border:1px solid rgba(217,251,79,.4);border-radius:7px;
    background:rgba(217,251,79,.08);color:var(--lime);
    font-size:11px;font-weight:800;letter-spacing:.05em;
  }
  .vname{font-size:14px;font-weight:800;letter-spacing:-.012em;color:#fff;margin:0;line-height:1.25}
  .vsub{font-size:11px;color:rgba(255,255,255,.55);margin:2px 0 0}
  .hbtn{
    width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;
    border:1px solid rgba(255,255,255,.16);border-radius:7px;
    background:rgba(255,255,255,.04);color:#fff;cursor:pointer;
    transition:background .14s,border-color .14s;
  }
  .hbtn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28)}

  /* money strip in header */
  .money-strip{
    display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
    padding:8px 18px 11px;border-top:1px solid rgba(255,255,255,.10);
  }
  .ms-main .ms-lbl{
    display:block;font-size:11px;font-weight:600;letter-spacing:.11em;
    text-transform:uppercase;color:rgba(255,255,255,.48);
  }
  .ms-main .ms-val{
    display:block;margin-top:1px;font-size:22px;font-weight:800;letter-spacing:-.03em;
    line-height:1.05;color:var(--lime);font-variant-numeric:tabular-nums;
  }
  .ms-side{text-align:right}
  .ms-side .ms-date{font-size:11px;color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums}
  .ms-side .ms-next{
    display:block;margin-top:2px;font-size:11.5px;font-weight:600;
    color:rgba(255,255,255,.78);font-variant-numeric:tabular-nums;
  }

  /* ── scroll body ── */
  .body{
    flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    padding:0 16px 24px;
    scrollbar-width:thin;scrollbar-color:#C5C7C0 transparent;
    background-image:radial-gradient(circle,rgba(11,18,32,.055) 1px,transparent 1px);
    background-size:22px 22px;
    background-color:#EEEEE9;
  }
  .body::-webkit-scrollbar{width:3px}
  .body::-webkit-scrollbar-thumb{background:#C5C7C0;border-radius:2px}

  /* lead */
  .lead{padding:18px 0 12px}
  .lead h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.032em;line-height:1.08}
  .lead p{margin:7px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted);max-width:33ch}
  .lead b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}

  /* ── queue cards ── */
  .queue{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

  .job{
    background:var(--card-2);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 10px -4px rgba(11,18,32,.14),0 1px 2px rgba(11,18,32,.06);
    animation:rise .45s cubic-bezier(.16,1,.3,1) both;
    transition:box-shadow .16s,transform .16s;
  }
  .job:hover{box-shadow:0 10px 28px -10px rgba(11,18,32,.24),0 2px 4px rgba(11,18,32,.07);transform:translateY(-1px)}
  .job:nth-child(1){animation-delay:.04s}
  .job:nth-child(2){animation-delay:.10s}
  .job:nth-child(3){animation-delay:.16s}

  /* top part of card: date + content */
  .job-inner{display:flex;gap:0}

  /* date column — distinct bg */
  .job-cal{
    flex:0 0 52px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;padding:12px 0 10px;
    background:#F4F4EF;border-right:1px solid var(--line);
  }
  .job-cal .jdow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);line-height:1.2}
  .job-cal .jdom{font-size:21px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink)}
  .job-cal .jmon{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.2}

  /* content column */
  .job-content{flex:1 1 auto;min-width:0;padding:12px 12px 0}
  .job-title{margin:0;font-size:14px;font-weight:700;letter-spacing:-.014em;line-height:1.3}
  .job-who{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
  .job-time{margin:2px 0 0;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* bottom strip: money + actions */
  .job-foot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 12px 10px;
    border-top:1px solid #EAEAE4;
    background:#F7F7F3;
  }
  .job-val{font-size:14px;font-weight:700;letter-spacing:-.014em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .job-timer{
    display:inline-flex;align-items:center;gap:4px;
    font-size:11px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;
    margin-top:2px;
  }
  .job-timer::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--amber);flex:0 0 auto}
  .job-timer.calm{color:var(--muted)}
  .job-timer.calm::before{background:#A0A8B0}
  .job-acts{display:flex;gap:5px}

  .btn{
    height:32px;padding:0 12px;border-radius:6px;border:1px solid transparent;
    font:inherit;font-size:12px;font-weight:700;cursor:pointer;
    transition:background .14s,border-color .14s,transform .1s;
  }
  .btn:active{transform:translateY(1px)}
  .btn-p{background:var(--lime);border-color:var(--lime-dk);color:var(--ink)}
  .btn-p:hover{background:var(--lime-dk)}
  .btn-s{background:#fff;border-color:#D4D6D0;color:var(--ink)}
  .btn-s:hover{background:#F4F4F0;border-color:#BBBDB7}

  /* accepted / declined states */
  .job-done{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--green)}
  .job-done::before{content:"";width:6px;height:6px;background:var(--green)}
  .job-declined{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--muted)}
  .job-declined::before{content:"";width:6px;height:6px;background:#B0B4B8}
  .undo{padding:0;border:0;background:none;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer}

  /* ── sections ── */
  .sec{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:20px 0 9px;
  }
  .sec h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#3F4A58}
  .sec small{font-size:11px;color:var(--muted)}

  /* week grid — inside a card surface */
  .week-wrap{
    padding:11px 12px 10px;
    background:var(--card-2);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 1px 4px rgba(11,18,32,.06);
  }
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .day{display:flex;flex-direction:column;align-items:center;gap:5px}
  .day .wd{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .day .dn{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
  .day.cur .dn{color:var(--ink);text-decoration:underline;text-decoration-color:var(--lime-dk);text-underline-offset:2px;text-decoration-thickness:2px}
  .slots{display:flex;flex-direction:column;width:100%}
  .slot{height:7px;border-radius:2px;background:#DDDDD7}
  .slot.on{background:var(--ink)}
  .wleg{display:flex;gap:12px;margin-top:9px;padding-top:7px;border-top:1px solid #EBEBE5}
  .wleg span{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
  .wleg i{display:block;width:10px;height:4px;border-radius:1px}

  /* saldo ledger */
  .panel{
    background:var(--card-2);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 1px 4px rgba(11,18,32,.06);overflow:hidden;
  }
  .ledger{margin:0;padding:0 14px}
  .ledger>div{
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding:10px 0;border-bottom:1px solid #EBEBE5;
  }
  .ledger>div:last-child{border-bottom:0}
  .ledger dt{margin:0;font-size:12.5px;color:var(--muted)}
  .ledger dd{margin:0;font-size:13px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .ledger .dimm dd{color:#485060;font-weight:600}
  .ledger .hi dt{color:var(--ink);font-weight:600}
  .ledger .hi dd{font-size:14.5px;color:var(--green)}
  .note{margin:8px 0 0;font-size:11px;line-height:1.5;color:#7A8290}

  /* ── bottom nav ── */
  .nav{
    flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
    padding:8px 2px 10px;
    background:var(--card-2);border-top:1px solid var(--line);
    position:relative;z-index:2;
  }
  .ntab{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0 0;
    border:0;background:none;font:inherit;font-size:11px;font-weight:600;color:#88929C;cursor:pointer;
    transition:color .14s;
  }
  .ntab svg{width:20px;height:20px}
  .ntab:hover{color:#3F4A58}
  .ntab[aria-current]{color:var(--ink);font-weight:700}
  .ntab[aria-current]::before{
    content:"";position:absolute;top:-8px;width:20px;height:2px;
    background:var(--lime-dk);border-radius:1px;
  }

  /* ── sheet ── */
  .sheet-bg{
    position:absolute;inset:0;z-index:20;display:none;align-items:flex-end;
    background:rgba(11,18,32,.38);
  }
  .sheet-bg.open{display:flex}
  .sheet-box{
    width:100%;padding:16px 18px 20px;
    background:var(--card-2);border-top:2px solid var(--lime);border-radius:14px 14px 0 0;
    transform:translateY(8px);opacity:0;
    transition:transform .28s cubic-bezier(.16,1,.3,1),opacity .18s;
  }
  .sheet-bg.open .sheet-box{transform:none;opacity:1}
  .sheet-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
  .sheet-hd p{margin:0;font-size:14.5px;font-weight:800;letter-spacing:-.012em}
  .sheet-hd small{display:block;margin-top:2px;font-size:11.5px;color:var(--muted)}
  .sheet-hd .hbtn{border-color:var(--line);background:#F4F4F0;color:var(--ink)}
  .sheet-close{width:100%;height:38px;margin-top:12px;font-size:13px}

  /* ── DETAIL SCREEN ── */
  .det-head .head-row{padding:0 18px 13px}
  .back{
    width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;margin-left:-6px;
    border:1px solid rgba(255,255,255,.16);border-radius:7px;
    background:rgba(255,255,255,.04);color:#fff;cursor:pointer;
    transition:background .14s;
  }
  .back:hover{background:rgba(255,255,255,.1)}
  .det-h1{flex:1 1 auto;margin:0;font-size:15px;font-weight:700;letter-spacing:-.012em;color:#fff}
  .badge-wait{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lime);
  }
  .badge-wait::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--lime)}

  /* event card — floats over the dark-to-light transition */
  .evt-card{
    margin:14px 0 0;
    background:var(--card-2);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 6px 20px -10px rgba(11,18,32,.38);
    overflow:hidden;
  }
  .evt-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px 8px;border-bottom:1px solid #EBEBE5;
    background:#F7F7F3;
  }
  .evt-kicker{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .pill-dp{
    display:inline-flex;align-items:center;gap:4px;padding:3px 7px;
    border-radius:4px;background:#EAFAF3;color:#076C48;font-size:11px;font-weight:700;
  }
  .pill-dp::before{content:"";width:4px;height:4px;border-radius:50%;background:#076C48}
  .evt-body{padding:12px 14px 14px}
  .evt-day{margin:0;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .evt-date{margin:5px 0 0;font-size:25px;font-weight:800;letter-spacing:-.034em;line-height:1.04}
  .evt-time{margin:7px 0 0;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .evt-sep{height:1px;margin:11px 0;background:#EBEBE5}
  .evt-kind{margin:0;font-size:13px;font-weight:700}
  .evt-place{margin:3px 0 0;font-size:11.5px;color:var(--muted)}

  /* stepper */
  .stepper{
    position:relative;display:grid;grid-template-columns:repeat(3,1fr);
    list-style:none;margin:0;padding:11px 0 9px;
  }
  .stepper::before{
    content:"";position:absolute;left:16.67%;right:16.67%;top:16px;height:1px;background:#DDDDD7;
  }
  .step-prog{position:absolute;left:16.67%;top:16px;height:1px;width:33.33%;background:var(--ink)}
  .stepper li{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
  .snode{width:9px;height:9px;border:1.5px solid #C0C3BC;background:var(--card-2);position:relative;z-index:1}
  .stepper li.done .snode{background:var(--ink);border-color:var(--ink)}
  .stepper li.now .snode{background:var(--lime);border-color:var(--lime-dk);box-shadow:0 0 0 3px rgba(217,251,79,.28)}
  .sk{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
  .st{font-size:11.5px;font-weight:600;color:var(--ink)}
  .stepper li:not(.done):not(.now) .st{color:var(--muted)}

  /* pay bar */
  .paybar{padding:12px 14px 11px;border-bottom:1px solid #EBEBE5}
  .pb-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
  .pb-row span{font-size:11.5px;color:var(--muted)}
  .pb-row b{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .pb-track{height:4px;border-radius:2px;background:#DDDDD7;overflow:hidden}
  .pb-fill{height:100%;width:30%;background:var(--lime-dk)}
  .pb-note{margin:5px 0 0;font-size:11px;color:#8A929C;font-variant-numeric:tabular-nums}

  /* person row */
  .person{display:flex;align-items:center;gap:10px;padding:12px 14px}
  .avatar{
    width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;

<script>
(function(){
  var reduce = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var countEl = document.querySelector("[data-count]");
  function setCount(){
    if(!countEl) return;
    countEl.textContent = String(document.querySelectorAll(".job:not(.accepted):not(.declined)").length);
  }
  function doAccept(btn){
    var job = btn.closest(".job"); if(!job) return;
    job.classList.add("accepted");
    var acts = job.querySelector("[data-actions]");
    if(acts) acts.innerHTML = '<span class="job-done">Diterima &mdash; jadwal dikunci</span>';
    setCount();
  }
  function doDecline(btn){
    var job = btn.closest(".job"); if(!job) return;
    job.classList.add("declined");
    var acts = job.querySelector("[data-actions]");
    if(acts){
      acts.innerHTML = '<span class="job-declined">Ditolak<button class="undo" type="button">Batalkan</button></span>';
      var u = acts.querySelector(".undo");
      if(u) u.addEventListener("click",function(){
        job.classList.remove("declined");
        acts.innerHTML = '<button class="btn btn-s" type="button" data-decline>Tolak</button><button class="btn btn-p" type="button" data-accept>Terima</button>';
        bindActs(acts); setCount();
      });
    }
    setCount();
  }
  function bindActs(root){
    root.querySelectorAll("[data-accept]").forEach(function(b){ b.addEventListener("click",function(){ doAccept(b); }); });
    root.querySelectorAll("[data-decline]").forEach(function(b){ b.addEventListener("click",function(){ doDecline(b); }); });
  }
  bindActs(document);

  // sheet
  var sheet = document.getElementById("sheet");
  document.querySelectorAll("[data-open-sheet]").forEach(function(b){ b.addEventListener("click",function(){ sheet && sheet.classList.add("open"); }); });
  document.querySelectorAll("[data-close-sheet]").forEach(function(b){ b.addEventListener("click",function(){ sheet && sheet.classList.remove("open"); }); });
  if(sheet){
    sheet.addEventListener("click",function(e){ if(e.target===sheet) sheet.classList.remove("open"); });
  }
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && sheet) sheet.classList.remove("open"); });

  // tab scroll
  var scroller = document.getElementById("b1");
  document.querySelectorAll(".ntab[data-target]").forEach(function(tab){
    tab.addEventListener("click",function(){
      var group = tab.closest(".nav");
      if(group) group.querySelectorAll(".ntab").forEach(function(t){ t.removeAttribute("aria-current"); });
      tab.setAttribute("aria-current","page");
      var id = tab.getAttribute("data-target");
      if(id==="top"){ scroller && scroller.scrollTo({top:0,behavior:reduce?"auto":"smooth"}); return; }
      var el = document.getElementById(id);
      if(el && scroller) scroller.scrollTo({top:el.offsetTop - 8, behavior:reduce?"auto":"smooth"});
    });
  });

  // detail bar
  var bar = document.querySelector(".actbar");
  function settle(msg){ if(bar) bar.innerHTML = '<p class="settle-line">'+msg+'</p>'; }
  var da = document.querySelector("[data-accept-det]");
  var dd = document.querySelector("[data-decline-det]");
  if(da) da.addEventListener("click",function(){ settle("Pesanan diterima. Jadwal 7 Nov dikunci."); });
  if(dd) dd.addEventListener("click",function(){ settle("Pesanan ditolak. DP dikembalikan ke pelanggan."); });

  // screen navigation across the board
  document.querySelectorAll("[data-screen]").forEach(function(el){
    el.addEventListener("click",function(){
      var target = document.getElementById(el.getAttribute("data-screen"));
      if(target) target.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
    });
  });

  // kalender
  var MONTHS=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  var DAYNAMES=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
  function pad2(n){ return n<10 ? "0"+n : String(n); }
  function dayKey(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }

  var booked={"2026-10-25":1,"2026-10-29":1,"2026-11-02":1,"2026-11-07":1,"2026-11-08":1,"2026-11-11":1,"2026-11-12":1,"2026-11-15":1,"2026-11-18":1};
  var agendaData={
    "2026-10-25":[{t:"09.00",e:"17.00",n:"Toha",m:"Sliyeg \u00B7 Organ / Tarling",v:"Rp5.400.000",s:"no",l:"Ditolak"}],
    "2026-10-29":[{t:"07.30",e:"13.00",n:"Endang S.",m:"Losarang \u00B7 Organ / Tarling",v:"Rp2.900.000",s:"done",l:"Selesai"}],
    "2026-11-02":[{t:"09.00",e:"15.00",n:"Surya Atmaja",m:"Balongan \u00B7 Organ / Tarling",v:"Rp8.100.000",s:"done",l:"Selesai"}],
    "2026-11-07":[{t:"07.00",e:"dini hari",n:"Ibu Narti",m:"Jatibarang \u00B7 Organ / Tarling",v:"Rp6.500.000",s:"wait",l:"Menunggu"}],
    "2026-11-08":[{t:"08.00",e:"16.00",n:"Rina Wati",m:"Karangampel \u00B7 Organ / Tarling",v:"Rp3.800.000",s:"ok",l:"Diterima"}],
    "2026-11-11":[{t:"09.00",e:"15.00",n:"Surya Atmaja",m:"Balongan \u00B7 Organ / Tarling",v:"Rp4.100.000",s:"ok",l:"Diterima"}],
    "2026-11-12":[{t:"07.30",e:"13.00",n:"Endang S.",m:"Losarang \u00B7 Organ / Tarling",v:"Rp2.900.000",s:"ok",l:"Diterima"}],
    "2026-11-15":[{t:"07.00",e:"dini hari",n:"Pak Darto",m:"Karangampel \u00B7 Organ / Tarling",v:"Rp9.200.000",s:"wait",l:"Menunggu"}],
    "2026-11-18":[{t:"08.00",e:"17.00",n:"H. Marzuki",m:"Losarang \u00B7 Organ / Tarling",v:"Rp4.750.000",s:"wait",l:"Menunggu"}]
  };

  var calGrid=document.getElementById("calGrid");
  var calMonthEl=document.getElementById("calMonth");
  var agWrap=document.getElementById("agWrap");
  var agDate=document.getElementById("agDate");
  var monthState={y:2026,m:10};
  var selectedDay="2026-11-07";

  function updateCalSummary(y,m){
    var prefix=y+"-"+pad2(m+1);
    var filled=0;
    for(var k in booked){ if(k.indexOf(prefix)===0) filled++; }
    var total=new Date(y,m+1,0).getDate();
    var lbl=document.getElementById("calSumLbl");
    var bar=document.getElementById("calBar");
    var pill=document.getElementById("calPill");
    if(lbl) lbl.textContent=filled+" dari "+total+" hari terisi";
    if(bar) bar.style.width=Math.round(filled/total*100)+"%";
    if(pill) pill.textContent="Terisi "+filled+" hari";
  }

  function renderMonth(){
    if(!calGrid || !calMonthEl) return;
    var y=monthState.y, m=monthState.m;
    var startIdx=(new Date(y,m,1).getDay()+6)%7;
    var daysInMonth=new Date(y,m+1,0).getDate();
    var prevMonthDays=new Date(y,m,0).getDate();
    var html="";
    for(var i=0;i<42;i++){
      var outside=false, dY=y, dM=m, dNum;
      var offset=i-startIdx;
      if(offset<0){ dNum=prevMonthDays+offset+1; dM=m-1; outside=true; if(dM<0){ dM=11; dY=y-1; } }
      else if(offset>=daysInMonth){ dNum=offset-daysInMonth+1; dM=m+1; outside=true; if(dM>11){ dM=0; dY=y+1; } }
      else { dNum=offset+1; }
      var k=dayKey(dY,dM,dNum);
      html+='<button class="cal-day'+(outside?" out":"")+(booked[k]?" has":"")+'" type="button" data-date="'+k+'" aria-pressed="'+(k===selectedDay?"true":"false")+'"><span class="cal-n">'+dNum+'</span><span class="cal-dot" aria-hidden="true"></span></button>';
    }
    calGrid.innerHTML=html;
    calMonthEl.textContent=MONTHS[m]+" "+y;
    updateCalSummary(y,m);
  }

  function renderAgenda(key){
    if(!agWrap || !agDate) return;
    var list=agendaData[key] || [];
    var d=new Date(key+"T00:00:00");
    if(!isNaN(d.getTime())){
      agDate.textContent=DAYNAMES[(d.getDay()+6)%7]+", "+d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
    }
    if(!list.length){
      agWrap.innerHTML='<div class="empty"><p>Belum ada acara</p><small>Tanggal ini masih kosong. Pesanan baru muncul di sini setelah DP masuk.</small></div>';
      return;
    }
    var html='<ul class="agenda">';
    list.forEach(function(a){
      html+='<li class="ag">'+
        '<span class="ag-time">'+a.t+'<small>'+a.e+'</small></span>'+
        '<div class="ag-body">'+
          '<p class="ag-name">'+a.n+'</p>'+
          '<p class="ag-meta">'+a.m+'</p>'+
          '<p class="ag-val">'+a.v+'</p>'+
        '</div>'+
        '<span class="pill '+a.s+'">'+a.l+'</span>'+
      '</li>';
    });
    agWrap.innerHTML=html+'</ul>';
  }

  if(calGrid){
    calGrid.addEventListener("click",function(e){
      var btn=e.target.closest(".cal-day");
      if(!btn) return;
      calGrid.querySelectorAll(".cal-day").forEach(function(c){ c.setAttribute("aria-pressed","false"); });
      btn.setAttribute("aria-pressed","true");
      selectedDay=btn.getAttribute("data-date");
      renderAgenda(selectedDay);
    });
  }

  document.querySelectorAll("[data-month]").forEach(function(btn){
    btn.addEventListener("click",function(){
      var step=parseInt(btn.getAttribute("data-month"),10) || 0;
      monthState.m+=step;
      if(monthState.m<0){ monthState.m=11; monthState.y--; }
      if(monthState.m>11){ monthState.m=0; monthState.y++; }
      renderMonth();
    });
  });

  // order filters
  var filterRail=document.getElementById("ordFilters");
  if(filterRail){
    filterRail.addEventListener("click",function(e){
      var chip=e.target.closest(".fchip");
      if(!chip) return;
      filterRail.querySelectorAll(".fchip").forEach(function(c){ c.setAttribute("aria-pressed","false"); });
      chip.setAttribute("aria-pressed","true");
      var want=chip.getAttribute("data-filter");
      var shown=0;
      document.querySelectorAll("#ordList .ord").forEach(function(row){
        var match=want==="all" || row.getAttribute("data-status")===want;
        if(match){ row.removeAttribute("hidden"); shown++; }
        else { row.setAttribute("hidden",""); }
      });
      var empty=document.getElementById("ordEmpty");
      if(empty){
        if(shown===0) empty.removeAttribute("hidden");
        else empty.setAttribute("hidden","");
      }
    });
  }

  // profil
  document.querySelectorAll("[data-switch]").forEach(function(row){
    row.addEventListener("click",function(){
      row.setAttribute("aria-checked", row.getAttribute("aria-checked")==="true" ? "false" : "true");
    });
  });

  document.querySelectorAll("[data-acc]").forEach(function(row){
    row.addEventListener("click",function(){
      var body=document.getElementById(row.getAttribute("data-acc"));
      if(!body) return;
      var isOpen=row.getAttribute("aria-expanded")==="true";
      row.setAttribute("aria-expanded", isOpen ? "false" : "true");
      if(isOpen) body.setAttribute("hidden","");
      else body.removeAttribute("hidden");
    });
  });

  setCount();
})();
</script>
</body>
</html>
