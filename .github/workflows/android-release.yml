name: android-release

# Rilis APK Android ke GitHub Releases, dipecah per ABI supaya lebih ringan.
#
# Alur:
#   1. Isi repository variable API_BASE_URL (Settings -> Secrets and variables
#      -> Actions -> Variables). Wajib https:// dan harus bisa dihubungi HP.
#   2. Opsional: GOOGLE_CLIENT_ID dan GOOGLE_SERVER_CLIENT_ID.
#      FCM_API_KEY, FCM_APP_ID, FCM_MESSAGING_SENDER_ID, FCM_PROJECT_ID untuk push.
#   3. Isi secrets signing: ANDROID_KEYSTORE_BASE64,
#      ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
#      Key ini harus sama dengan yang SHA-1-nya didaftarkan di Android OAuth
#      client Google Cloud.
#   4. Naikkan `version:` di apps/mobile/pubspec.yaml, commit, lalu push tag:
#        git tag v1.0.1 && git push origin v1.0.1
#   5. Workflow membangun tiga APK (arm64-v8a, armeabi-v7a, x86_64),
#      mengunggah artifact, dan membuat GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build APK release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Sama dengan CI: versi yang dipakai mengembangkan fitur.
          flutter-version: 3.35.2
          channel: stable
          cache: true

      - name: Validasi konfigurasi rilis
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Repository variable API_BASE_URL belum diisi."
            echo "Buka Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::API_BASE_URL harus https:// (APK release tidak boleh http)."
              exit 1
              ;;
          esac

      - run: flutter pub get

      - name: Siapkan keystore rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diisi."
            echo "Tanpa key tetap, SHA-1 APK berubah dan Google Sign-In gagal."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "release.keystore" \
            > android/key.properties

      - run: flutter analyze

      - run: flutter test

      - name: Build APK per ABI
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          FCM_API_KEY: ${{ vars.FCM_API_KEY }}
          FCM_APP_ID: ${{ vars.FCM_APP_ID }}
          FCM_MESSAGING_SENDER_ID: ${{ vars.FCM_MESSAGING_SENDER_ID }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          APP_UPDATE_MANIFEST_URL: ${{ vars.APP_UPDATE_MANIFEST_URL }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=FCM_API_KEY="$FCM_API_KEY" \
            --dart-define=FCM_APP_ID="$FCM_APP_ID" \
            --dart-define=FCM_MESSAGING_SENDER_ID="$FCM_MESSAGING_SENDER_ID" \
            --dart-define=FCM_PROJECT_ID="$FCM_PROJECT_ID" \
            --dart-define=APP_UPDATE_MANIFEST_URL="$APP_UPDATE_MANIFEST_URL"

      - name: Siapkan nama berkas
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            BASE="tarlink-${GITHUB_REF_NAME#v}"
          else
            BASE="tarlink-${GITHUB_SHA::7}"
          fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "${BASE}-${abi}.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: tarlink-android-apk
          path: apps/mobile/tarlink-*.apk
          if-no-files-found: error

      - name: Susun manifest pembaruan (latest.json)
        if: startsWith(github.ref, 'refs/tags/') && vars.APP_UPDATE_BASE_URL != ''
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION="${VERSION_LINE%%+*}"
          BUILD="${VERSION_LINE#*+}"
          if [ "$BUILD" = "$VERSION_LINE" ]; then
            echo "::error::pubspec.yaml harus memakai format version: X.Y.Z+N"
            exit 1
          fi
          node ../../scripts/publish-apk.mjs . \
            --version "$VERSION" \
            --build "$BUILD" \
            --base-url "${{ vars.APP_UPDATE_BASE_URL }}" \
            --notes "Tarlink ${{ github.ref_name }}" \
            --out latest.json

      - name: Pastikan bucket Supabase ada
        if: startsWith(github.ref, 'refs/tags/') && vars.APP_UPDATE_BASE_URL != ''
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ vars.APP_UPDATE_BUCKET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Service key belum diisi; bucket tidak diperiksa."
            exit 0
          fi
          BUCKET="${SUPABASE_BUCKET:-app-releases}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/storage/v1/bucket/$BUCKET" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          if [ "$CODE" = "200" ]; then
            echo "bucket $BUCKET sudah ada"
            exit 0
          fi
          curl -fsS -X POST "$SUPABASE_URL/storage/v1/bucket" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"$BUCKET\",\"name\":\"$BUCKET\",\"public\":true}" > /dev/null
          echo "bucket $BUCKET dibuat (public)"

      - name: Unggah APK + manifest ke Supabase Storage
        if: startsWith(github.ref, 'refs/tags/') && vars.APP_UPDATE_BASE_URL != ''
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ vars.APP_UPDATE_BUCKET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY belum diisi; APK tetap tersedia di GitHub Release, manifest tidak diunggah."
            exit 0
          fi
          BUCKET="${SUPABASE_BUCKET:-app-releases}"
          for f in tarlink-*.apk latest.json; do
            curl -fsS -X POST "$SUPABASE_URL/storage/v1/object/$BUCKET/$f" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "x-upsert: true" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" > /dev/null
            echo "unggah $BUCKET/$f"
          done
          curl -fsS "${{ vars.APP_UPDATE_BASE_URL }}/latest.json" | head -c 400
          echo

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Tarlink ${{ github.ref_name }}
          files: apps/mobile/tarlink-*.apk
          generate_release_notes: true
          body: |
            APK Android Tarlink ${{ github.ref_name }}, dipecah per ABI.

            - `arm64-v8a` — HP Android modern (pakai ini)
            - `armeabi-v7a` — HP lama 32-bit
            - `x86_64` — emulator

            - API: `${{ vars.API_BASE_URL }}`
            - Commit: `${{ github.sha }}`
            - Ditandatangani dengan release key; SHA-1-nya harus terdaftar
              di Android OAuth client Google Cloud untuk login Google.
